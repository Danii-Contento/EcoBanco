    function formatShortStellarAddress(address) {
      if (!address) return "";
      if (address.length <= 12) return address;
      return `${address.slice(0, 6)}...${address.slice(-4)}`;
    }

    function generateClassicStellarPreviewAddress(seed) {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
      let out = "G";
      let h = 2166136261;
      const src = String(seed || Date.now());
      for (let i = 0; i < 55; i++) {
        h ^= src.charCodeAt(i % src.length) + i * 31;
        h = Math.imul(h, 16777619);
        out += alphabet[Math.abs(h) % alphabet.length];
      }
      return out;
    }

    function formatBs(val) {
      const n = Math.round(Number(val ?? 0));
      return `${Number.isFinite(n) ? n : 0} Bs`;
    }

    function formatMotes(val) {
      const n = Math.round(Number(val ?? 0));
      return `${Number.isFinite(n) ? n : 0} MOTES`;
    }

    function formatOrderCode(rawId) {
      if (!rawId) return "Pedido";
      const match = String(rawId).match(/(\d{3,})$/);
      if (match) return `Pedido #${match[1]}`;
      return `Pedido #${String(rawId).slice(-4).toUpperCase()}`;
    }

    function generateUniqueRiderInviteCode(users) {
      const existingCodes = new Set(
        (users || []).map((u) => u.rider_invite_code || u.riderInviteCode).filter(Boolean)
      );
      for (let i = 0; i < 50; i++) {
        const candidate = `ECO-R-${Math.floor(1000 + Math.random() * 9000)}`;
        if (!existingCodes.has(candidate)) return candidate;
      }
      return `ECO-R-${String(Date.now()).slice(-4)}`;
    }

    function generateFourDigitPin(excludePin) {
      let pin = String(Math.floor(1000 + Math.random() * 9000));
      if (excludePin && pin === excludePin) {
        pin = String(((Number(pin) - 1000 + 1) % 9000) + 1000);
      }
      return pin;
    }

    function generateReferralCode(name) {
      const clean = (name || "USER")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9]/g, "")
        .toUpperCase()
        .slice(0, 6);
      const suffix = Math.floor(10 + Math.random() * 90);
      return `ECO-${clean || "USER"}${suffix}`;
    }

    }

    // "Modo Megas": Redimensiona (máx. 1080px) y comprime a WebP ligero (< 80 KB)
    function estimateDataUrlBytes(dataUrl) {
      const idx = dataUrl.indexOf(",");
      if (idx === -1) return dataUrl.length;
      const b64 = dataUrl.slice(idx + 1);
      return Math.floor((b64.length * 3) / 4);
    }

    function compressImageToWebP(file, callback) {
      if (!file) return;
      const objectUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(objectUrl);
        const maxDim = 1080;
        const maxBytes = 80 * 1024;
        const natW = img.naturalWidth || img.width || 1;
        const natH = img.naturalHeight || img.height || 1;
        const scale = Math.min(1, maxDim / Math.max(natW, natH));
        let w = Math.max(1, Math.round(natW * scale));
        let h = Math.max(1, Math.round(natH * scale));
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const probe = document.createElement("canvas");
        probe.width = 2;
        probe.height = 2;
        const mime = probe.toDataURL("image/webp", 0.5).startsWith("data:image/webp")
          ? "image/webp"
          : "image/jpeg";
        const qualities = [0.8, 0.7, 0.6, 0.5, 0.4, 0.32, 0.25];
        let best = "";
        let bestBytes = Infinity;

        for (let pass = 0; pass < 4; pass++) {
          canvas.width = w;
          canvas.height = h;
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          for (const q of qualities) {
            const out = canvas.toDataURL(mime, q);
            const bytes = estimateDataUrlBytes(out);
            if (bytes < bestBytes) {
              best = out;
              bestBytes = bytes;
            }
            if (bytes <= maxBytes) {
              callback(out);
              return;
            }
          }
          w = Math.max(320, Math.round(w * 0.78));
          h = Math.max(320, Math.round(h * 0.78));
        }
        callback(best);
      };
      img.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === "string") callback(reader.result);
        };
        reader.readAsDataURL(file);
      };
      img.src = objectUrl;
    }

    function ProtectedPurchaseBar({ deliveryStatus, orderStatus, amountBs, compact }) {
      const statusLower = (deliveryStatus || "").toLowerCase();
      const isDelivered = statusLower === "delivered" || orderStatus === "RELEASED";
      const isInTransit = statusLower === "in_transit";
      const fillPercent = isDelivered ? 100 : isInTransit ? 72 : 42;

      const steps = [
        {
          num: 1,
          done: true,
          active: false,
          label: amountBs
            ? `Pago guardado de forma segura (${Math.round(amountBs)} Bs retenidos).`
            : "Pago guardado de forma segura (Bs retenidos).",
        },
        {
          num: 2,
          done: isInTransit || isDelivered,
          active: !isInTransit && !isDelivered,
          label: isInTransit
            ? "Pedido listo y en camino con tu repartidor ecológico."
            : "La caserita está preparando tu pedido.",
        },
        {
          num: 3,
          done: isDelivered,
          active: isInTransit && !isDelivered,
          label: "Pedido entregado → Pago liberado a la caserita.",
        },
      ];

      return (
        <div className={`rounded-2xl bg-[#0F1A16] border border-brote/50 ${compact ? "p-3 space-y-2.5" : "p-4 space-y-3"}`}>
          <div className="flex flex-wrap items-center justify-between gap-2">
            <span className="text-xs font-extrabold uppercase tracking-wider text-brote">
              🛡️ Compra Protegida
            </span>
            <span className="px-2.5 py-0.5 rounded-full bg-brote/15 border border-brote/40 text-[11px] font-bold text-arena">
              Comisión: 0 Bs — Cubierta por EcoBanco
            </span>
          </div>
          {!compact && (
            <p className="text-xs text-arena/90 leading-relaxed">
              Tu dinero se guarda seguro y solo pasa a la caserita cuando recibes tu pedido.
            </p>
          )}
          <div className="w-full h-2.5 rounded-full bg-bosque border border-arena/20 overflow-hidden">
            <div
              className="h-full bg-gradient-to-r from-oro via-brillo to-brote transition-all duration-500"
              style={{ width: `${fillPercent}%` }}
            />
          </div>
          <ol className="space-y-2">
            {steps.map((step) => (
              <li
                key={step.num}
                className={`flex items-start gap-2.5 text-xs leading-snug ${
                  step.done ? "text-arena font-semibold" : step.active ? "text-brillo font-bold" : "text-arena/70"
                }`}
              >
                <span
                  className={`mt-0.5 w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-extrabold shrink-0 ${
                    step.done
                      ? "bg-brote text-bosque"
                      : step.active
                      ? "bg-oro text-bosque"
                      : "bg-bosque border border-arena/30 text-arena/75"
                  }`}
                >
                  {step.done ? "✓" : step.num}
                </span>
                <span>{step.label}</span>
              </li>
            ))}
          </ol>
        </div>
      );
    }

              isLoggedIn: true,

      const openPollarQrModal = (targetRole, purpose, defaultAmount) => {

      const confirmPollarRampOrderPreview = () => {

        if (!Number.isFinite(amount) || amount < 10) {
          setQrError("Ingresa un monto válido en Bolivianos (mínimo 10 Bs).");
          return;
        }
        if ((qrPurpose === "prosumer_subscription" || qrPurpose === "merchant_premium") && amount < SUBSCRIPTION_COST) {
          setQrError(`Esta activación requiere al menos ${SUBSCRIPTION_COST} Bs.`);
          return;
        }
        const cleanOrderId = (qrOrderId || "").trim();
        if (!cleanOrderId || rampTransactions.some((t) => t.pollar_order_id === cleanOrderId)) {
          setQrError("Esta orden de Pollar ya fue acreditada anteriormente.");
          return;
        }

        const targetUserId = qrTargetRole === "merchant" ? activeMerchantId : activeBuyerId;
        if (!targetUserId) {
          setQrError("Inicia sesión primero antes de acreditar una recarga.");
          return;
        }

        const txRecord = {
          id: `ramp-${Date.now()}`,
          pollar_order_id: cleanOrderId,
          user_id: targetUserId,
          role: qrTargetRole,
          purpose: qrPurpose,
          amount_bs: amount,
          fiat_currency: "BOB",

          stellar_address: pollarSession.stellarAddress,
          created_at: new Date().toISOString(),
        };
        setRampTransactions((prev) => [txRecord, ...prev]);

        setUsers((prev) =>
          prev.map((u) => {
            if (u.id !== targetUserId) return u;
            const curFiat = Number(u.fiatBs ?? 0);
            const curMotes = Number(u.motes ?? 0);
            const curFree = Number(u.free_deliveries_remaining ?? u.freeDeliveries ?? 0);
            if (qrPurpose === "prosumer_subscription" && !u.isProsumer) {
              const remainder = Math.max(0, amount - SUBSCRIPTION_COST);
              return {
                ...u,
                isProsumer: true,
                isPremium: true,
                motesEnabled: true,
                motes_enabled: true,
                fiatWalletEnabled: true,
                qrEnabled: true,
                fiatBs: curFiat + remainder,
                motes: curMotes + 50,
                freeDeliveries: curFree + PREMIUM_FREE_DELIVERIES,
                free_deliveries_remaining: curFree + PREMIUM_FREE_DELIVERIES,
                pollar_user_id: pollarSession.pollarUserId || u.pollar_user_id || null,
                stellar_address: pollarSession.stellarAddress || u.stellar_address || null,
              };
            }
            if (qrPurpose === "merchant_premium" && !u.isProsumer && !u.isPremium) {
              const remainder = Math.max(0, amount - SUBSCRIPTION_COST);
              return {
                ...u,
                isProsumer: true,
                isPremium: true,
                fiatWalletEnabled: true,
                qrEnabled: true,
                fiatBs: curFiat + remainder,
                freeDeliveries: curFree + PREMIUM_FREE_DELIVERIES,
                free_deliveries_remaining: curFree + PREMIUM_FREE_DELIVERIES,
                pollar_user_id: pollarSession.pollarUserId || u.pollar_user_id || null,
                stellar_address: pollarSession.stellarAddress || u.stellar_address || null,
              };
            }
            return {
              ...u,
              fiatWalletEnabled: true,
              fiatBs: curFiat + amount,
              pollar_user_id: pollarSession.pollarUserId || u.pollar_user_id || null,

        if (qrPurpose === "prosumer_subscription") {

      const uploadToBucket = (bucket, file, onDone) => {

      useEffect(() => {

      const syncConfigFields = (mer) => {

        setCfgStoreDescription(mer.storeDescription || "");
        setCfgAddress(mer.address || "");
        setCfgSchedule(mer.schedule || "");
        setCfgAvatarUrl(mer.avatarUrl || "");
        setCfgBankQrUrl(mer.bankQrUrl || "");

      // --- Ingreso y Registro de Caserita ---
      const handleMerchantLogin = (e) => {
        e.preventDefault();
        setAuthError(null);
        const normalize = (str) =>
          (str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();

        const cleanId = normalize(loginIdentifier);
        const cleanPhone = loginPhone.replace(/\s+/g, "").trim();
        const cleanPin = loginPin.replace(/\D/g, "").slice(0, 4);

        const found = merchants.find(
          (m) => normalize(m.storeName) === cleanId || normalize(m.ownerName) === cleanId
        );

        if (!found) {
          setAuthError("No encontramos un puesto con ese nombre.");
          return;
        }

        if (cleanPin.length === 4 && found.password === cleanPin) {
          setActiveMerchantId(found.id);
          syncConfigFields(found);
          setDismissProfilePrompt(false);
          setDismissPinSetup(false);
          setMerchantView("catalogo");
          setLoginIdentifier("");
          setLoginPhone("");
          setLoginPin("");
          return;
        }

        if (cleanPhone && (found.password === cleanPhone || found.phone === cleanPhone)) {
          let updatedMer = found;
          if (cleanPin.length === 4) {
            updatedMer = { ...found, password: cleanPin };
            setUsers((prev) => prev.map((u) => (u.id === found.id ? updatedMer : u)));
            setCfgMessage("¡Bienvenida! Guardamos tu clave secreta de 4 números para tus próximos ingresos.");
            setDismissPinSetup(true);
          } else {
            setDismissPinSetup(false);
          }
          setActiveMerchantId(updatedMer.id);
          syncConfigFields(updatedMer);
          setDismissProfilePrompt(false);
          setMerchantView("catalogo");
          setLoginIdentifier("");
          setLoginPhone("");
          setLoginPin("");
          return;
        }

        setAuthError("Revisa tu WhatsApp o tu clave secreta de 4 números.");
      };

      const handleMerchantRegister = (e) => {
        e.preventDefault();
        setAuthError(null);
        const cleanOwner = regOwnerName.trim();
        const cleanStore = regStoreName.trim();
        const cleanPhone = regPhone.replace(/\s+/g, "").trim();
        const cleanPin = regPin.replace(/\D/g, "").slice(0, 4);

        if (!cleanOwner || !cleanStore || !cleanPhone) {
          setAuthError("Completa tu nombre, nombre de puesto y WhatsApp.");
          return;
        }
        if (cleanPin.length !== 4) {
          setAuthError("Crea tu clave secreta de 4 números (como la del cajero).");
          return;
        }

        const exists = merchants.find(
          (m) => m.phone === cleanPhone || m.storeName.toLowerCase() === cleanStore.toLowerCase()
        );
        if (exists) {
          setAuthError("Ya existe una caserita registrada con ese puesto o número de WhatsApp.");
          return;
        }

        const newMer = {

          role: "merchant",
          ownerName: cleanOwner,
          storeName: cleanStore,
          phone: cleanPhone,
          password: cleanPin,
          storeDescription: "",
          address: "",
          schedule: "",
          avatarUrl: "",
          profileCompleted: false,
          bankQrUrl: "",
          isProsumer: false,
          isPremium: false,
          fiatWalletEnabled: false,
          qrEnabled: false,
          motesEnabled: true,
          motes: 0,
          fiatBs: 0,

          free_deliveries_remaining: 0,
          salesCount: 0,

        setDismissPinSetup(true);

        setRegOwnerName("");

        setRegPhone("");

      const handleSaveQuickPin = (e) => {

          prev.map((m) => (m.id === activeMerchant.id ? { ...m, password: cleanPin } : m))
        );

        setQuickPinInput("");

        setCfgMessage("¡Clave secreta de 4 números guardada! Ya puedes ingresar con tu PIN.");
      };

      const handleQuickAvatarUpload = (e) => {
        const file = e.target.files?.[0];
        uploadToBucket(BUCKETS.AVATARS, file, (dataUrl) => {
          setCfgAvatarUrl(dataUrl);
          setUsers((prev) =>
            prev.map((m) => {
              if (m.id !== activeMerchantId) return m;
              const isComplete = Boolean(m.storeDescription?.trim() && m.address?.trim() && m.schedule?.trim() && dataUrl);
              return { ...m, avatarUrl: dataUrl, profileCompleted: isComplete };
            })
          );
          setProducts((prev) =>
            prev.map((p) => (p.sellerId === activeMerchantId ? { ...p, sellerAvatarUrl: dataUrl } : p))
          );

      const handleBankQrUpload = (e) => {
        const file = e.target.files?.[0];
        uploadToBucket(BUCKETS.QR_BANCARIOS, file, (dataUrl) => {
          setCfgBankQrUrl(dataUrl);
          setUsers((prev) =>
            prev.map((m) =>
              m.id === activeMerchantId && (m.isProsumer || m.qrEnabled) ? { ...m, bankQrUrl: dataUrl } : m
            )
          );
          setCfgMessage("Tu QR bancario quedó guardado y listo para recibir cobros.");
        });
      };

      const handleCompleteOnboardingProfile = (e) => {
        e.preventDefault();
        setCfgError(null);
        setCfgMessage(null);
        if (!cfgStoreDescription.trim() || !cfgAddress.trim() || !cfgSchedule.trim() || !cfgAvatarUrl) {
          setCfgError("Completa la descripción, dirección, horario y sube la foto de tu puesto.");
          return;
        }
        setUsers((prev) =>
          prev.map((m) =>
            m.id === activeMerchant.id
              ? {
                  ...m,
                  storeDescription: cfgStoreDescription.trim(),
                  address: cfgAddress.trim(),
                  schedule: cfgSchedule.trim(),
                  avatarUrl: cfgAvatarUrl,
                  profileCompleted: true,
                }
              : m
          )
        );
        setProducts((prev) =>
          prev.map((p) =>
            p.sellerId === activeMerchant.id
              ? { ...p, sellerAvatarUrl: cfgAvatarUrl, sellerAddress: cfgAddress.trim(), sellerSchedule: cfgSchedule.trim() }
              : p
          )
        );
        setDismissProfilePrompt(true);
        setCfgMessage("¡Tu puesto digital está listo para recibir pedidos!");
      };

      const handleSaveConfig = (e) => {
        e.preventDefault();
        if (!activeMerchant) return;
        setCfgError(null);
        const oldStore = activeMerchant.storeName;
        const newStore = cfgStoreName.trim() || oldStore;
        const isComplete = Boolean(cfgStoreDescription.trim() && cfgAddress.trim() && cfgSchedule.trim() && cfgAvatarUrl);
        setUsers((prev) =>
          prev.map((m) =>
            m.id === activeMerchant.id
              ? {
                  ...m,
                  storeName: newStore,
                  password: cfgPassword.trim() || m.password,
                  storeDescription: cfgStoreDescription.trim(),
                  address: cfgAddress.trim(),
                  schedule: cfgSchedule.trim(),
                  avatarUrl: cfgAvatarUrl,
                  profileCompleted: isComplete,
                  bankQrUrl: m.isProsumer ? cfgBankQrUrl : m.bankQrUrl,
                }
              : m
          )
        );
        setProducts((prev) =>
          prev.map((p) =>
            p.sellerId === activeMerchant.id || p.sellerName === oldStore
              ? { ...p, sellerName: newStore, sellerAvatarUrl: cfgAvatarUrl, sellerAddress: cfgAddress.trim(), sellerSchedule: cfgSchedule.trim() }
              : p
          )
        );
        setCfgMessage("Cambios guardados correctamente.");
      };

      const handleUnlockAliada = (paymentMethod) => {
        if (!activeMerchant) return;
        setCfgError(null);
        setCfgMessage(null);
        if (paymentMethod === "motes" && activeMerchant.motes < SUBSCRIPTION_COST) {
          setCfgError(`Te faltan ${SUBSCRIPTION_COST - activeMerchant.motes} MOTES en ventas para activarlo gratis.`);
          return;
        }
        let deductFiat = false;
        if (paymentMethod === "fiat") {
          if (Number(activeMerchant.fiatBs ?? 0) >= SUBSCRIPTION_COST) {
            deductFiat = true;
          } else {
            openPollarQrModal("merchant", "merchant_premium", SUBSCRIPTION_COST);
            return;
          }
        }
        setUsers((prev) =>
          prev.map((m) => {
            if (m.id !== activeMerchant.id || m.isProsumer) return m;
            if (paymentMethod === "motes") {
              return {
                ...m,
                isProsumer: true,
                isPremium: true,
                fiatWalletEnabled: true,
                qrEnabled: true,
                motes: m.motes - SUBSCRIPTION_COST,
                freeDeliveries: Number(m.freeDeliveries ?? 0) + PREMIUM_FREE_DELIVERIES,
                free_deliveries_remaining: Number(m.free_deliveries_remaining ?? 0) + PREMIUM_FREE_DELIVERIES,
              };
            }
            return {
              ...m,
              isProsumer: true,
              isPremium: true,
              fiatWalletEnabled: true,
              qrEnabled: true,
              fiatBs: deductFiat ? Number(m.fiatBs ?? 0) - SUBSCRIPTION_COST : Number(m.fiatBs ?? 0),
              freeDeliveries: Number(m.freeDeliveries ?? 0) + PREMIUM_FREE_DELIVERIES,
              free_deliveries_remaining: Number(m.free_deliveries_remaining ?? 0) + PREMIUM_FREE_DELIVERIES,
            };
          })
        );
        setCfgMessage(
          paymentMethod === "motes"
            ? "¡Ya eres Caserita Aliada con tus 100 MOTES! Tu cobro directo a QR bancario y 5 envíos ecológicos gratis ya están activos."
            : "¡Pago de 100 Bs confirmado! Conservas todos tus MOTES y ya tienes activos tu cobro directo a QR bancario y 5 envíos ecológicos gratis."
        );
      };

      const handleContinueToProductPreview = (e) => {
        e.preventDefault();
        setProductError(null);
        if (!formImageUrl) {
          setProductError("Primero sube una foto real de tu producto.");
          return;
        }
        if (!formName.trim() || Number(formPrice) <= 0) {
          setProductError("Escribe el nombre del producto y un precio en Bolivianos (Bs).");
          return;
        }
        setProductStep("preview");
      };

      const handleConfirmPublishProduct = () => {
        const resolvedPrice = Math.round(Number(formPrice));
        const resolvedDesc =
          formDescription.trim() || `${formName.trim()} — Producto fresco de ${activeMerchant.storeName}.`;

        if (editingProduct) {
          setProducts((prev) =>
            prev.map((p) =>
              p.id === editingProduct.id
                ? { ...p, name: formName.trim(), priceMotes: resolvedPrice, description: resolvedDesc, imageUrl: formImageUrl }
                : p
            )
          );
        } else {
          setProducts((prev) => [
            {
              id: `prod-${Date.now()}`,
              sellerId: activeMerchant.id,
              sellerName: activeMerchant.storeName,
              sellerPhone: activeMerchant.phone,
              sellerAvatarUrl: activeMerchant.avatarUrl,
              sellerAddress: activeMerchant.address,
              sellerSchedule: activeMerchant.schedule,
              name: formName.trim(),
              priceMotes: resolvedPrice,
              description: resolvedDesc,
              imageUrl: formImageUrl,
            },
            ...prev,
          ]);
        }
        setIsModalOpen(false);
        setCfgMessage(editingProduct ? "Producto actualizado." : "¡Producto publicado! Ya está visible para tus vecinos.");
      };

      // --- Mercado del Barrio & Compra Protegida ---
      const executeProtectedPurchase = (product, role, buyerOverride) => {
        setPurchaseError(null);
        const buyerUser = role === "merchant" ? activeMerchant : buyerOverride || activeBuyer;
        if (!buyerUser) {
          setPurchaseError("Completa tus datos de entrega antes de confirmar.");
          return;
        }
        const deliveryAddress = (buyerUser.deliveryAddress || buyerUser.delivery_address || buyerUser.address || "").trim();
        if (role === "buyer" && (!String(buyerUser.phone || "").trim() || !deliveryAddress)) {
          setPurchaseError("Completa tu WhatsApp y dirección de entrega para confirmar tu pedido.");
          return;
        }

        const priceMotes = Math.round(Number(product.priceMotes));
        const buyerMotes = Number(buyerUser.motes ?? 0);
        const buyerFiatBs = Number(buyerUser.fiatBs ?? 0);
        const buyerMotesEnabled =
          role === "merchant" || Boolean(buyerUser.motesEnabled || buyerUser.motes_enabled || buyerUser.isProsumer);

        if (role === "merchant" && buyerMotes < priceMotes) {
          setPurchaseError("No tienes suficientes Puntos de Trueque (MOTES) para este pedido.");
          return;
        }

        let nextBuyerMotes = buyerMotes;
        let nextBuyerFiat = buyerFiatBs;
        if (buyerMotesEnabled && buyerMotes >= priceMotes) {
          nextBuyerMotes = buyerMotes - priceMotes;
        } else if (role === "buyer" && buyerFiatBs >= priceMotes) {
          nextBuyerFiat = buyerFiatBs - priceMotes;
        } else {
          setPurchaseError(
            `Saldo insuficiente para confirmar esta compra (${priceMotes} Bs). Tu saldo actual es ${buyerFiatBs} Bs${buyerMotesEnabled ? ` y ${buyerMotes} MOTES` : ""}.`
          );
          return;
        }

        const sellerAccount = users.find(
          (u) =>
            u.role === "merchant" &&
            (u.id === product.sellerId ||
              (u.storeName && u.storeName.toLowerCase() === (product.sellerName || "").toLowerCase()))
        );
        const sellerFreeDeliveries = Number(sellerAccount?.free_deliveries_remaining ?? sellerAccount?.freeDeliveries ?? 0);
        const usedFreeDelivery = Boolean(sellerAccount && sellerFreeDeliveries > 0);

        setUsers((prev) =>
          prev.map((u) => {
            if (sellerAccount && u.id === sellerAccount.id && u.id === buyerUser.id) {
              return {
                ...u,
                motes: nextBuyerMotes,
                ...(usedFreeDelivery
                  ? { freeDeliveries: sellerFreeDeliveries - 1, free_deliveries_remaining: sellerFreeDeliveries - 1 }
                  : {}),
              };
            }
            if (u.id === buyerUser.id) {
              return { ...u, motes: nextBuyerMotes, fiatBs: nextBuyerFiat };
            }
            if (sellerAccount && u.id === sellerAccount.id && usedFreeDelivery) {
              return { ...u, freeDeliveries: sellerFreeDeliveries - 1, free_deliveries_remaining: sellerFreeDeliveries - 1 };
            }
            return u;
          })
        );

        const ts = Date.now();
        const nowIso = new Date().toISOString();
        const orderId = `ord-${ts}`;
        const contractId = `PED-${Math.floor(1000 + Math.random() * 9000)}`;
        const pickupPin = generateFourDigitPin();
        const deliveryPin = generateFourDigitPin(pickupPin);

        const newOrder = {
          id: orderId,
          contract_id: contractId,
          product_id: product.id,
          product_name: product.name,
          seller_id: sellerAccount?.id || product.sellerId || null,
          seller_name: sellerAccount?.storeName || product.sellerName,
          buyer_id: buyerUser.id,
          buyer_type: role,
          amount_motes: priceMotes,
          status: "LOCKED_IN_ESCROW",
          created_at: nowIso,
        };

        const newDelivery = {
          id: `del-${ts}`,
          order_id: orderId,
          contract_id: contractId,
          product_name: product.name,
          amount_motes: priceMotes,
          buyer_id: buyerUser.id,
          buyer_name: buyerUser.storeName || buyerUser.name || "Vecino",
          delivery_address: deliveryAddress || "Entrega en tu barrio",
          seller_id: sellerAccount?.id || product.sellerId || null,
          seller_name: sellerAccount?.storeName || product.sellerName,
          seller_phone: sellerAccount?.phone || product.sellerPhone || null,
          pickup_address: sellerAccount?.address || product.sellerAddress || "Puesto de la Caserita",
          delivery_status: "pending",
          used_free_delivery: usedFreeDelivery,

                        </div>
                        <div className="rounded-2xl bg-gradient-to-br from-[#1B3326] to-[#292315] border-2 border-brote/80 p-5">
                          <span className="text-xs font-extrabold uppercase text-brillo block">Puntos de Trueque (MOTES)</span>
                          <div className="my-2 flex items-baseline gap-1.5">
                            <span className="font-brand text-4xl text-brillo">{Math.round(rider.motesEarned ?? 0)}</span>
                            <span className="text-sm font-extrabold text-brote">MOTES</span>
                          </div>
                          <p className="text-xs font-bold text-arena">1 MOTE = 1 Bs en productos del barrio</p>
                          <p className="text-xs text-arena/85 mt-1">{rider.completedDeliveries ?? 0} entregas completadas</p>
                        </div>
                      </div>
                    </section>
                  )}
                </>
              )}
            </main>
          )}

          {/* MODAL ALTA RÁPIDA DE PRODUCTO (3 BLOQUES + VISTA PREVIA) */}
          {isModalOpen && activeMerchant && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-end sm:items-center justify-center p-4">
              <div className="max-w-md w-full rounded-2xl bg-[#172620] border-2 border-brote p-6 space-y-5 max-h-[92vh] overflow-y-auto">
                <div className="flex items-center justify-between">
                  <h3 className="font-brand text-2xl text-arena">
                    {productStep === "preview" ? "¿Se ve bien tu producto?" : editingProduct ? "Editar Producto" : "Publicar Producto"}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-sm font-extrabold text-arena/85">✕ Cerrar</button>
                </div>

                {productError && <div className="p-3 rounded-xl bg-red-500/20 border border-red-400/60 text-sm font-bold text-red-100">⚠️ {productError}</div>}

                {productStep === "edit" ? (
                  <form onSubmit={handleContinueToProductPreview} className="space-y-4">
                    <div className="rounded-2xl bg-bosque/80 border-2 border-oro/50 p-4 space-y-2">
                      <span className="block text-sm font-extrabold uppercase text-brillo">1. Foto del producto</span>
                      <label className="block w-full rounded-2xl border-2 border-dashed border-oro/70 bg-[#0D1714] p-4 text-center cursor-pointer">
                        {formImageUrl ? (
                          <div className="space-y-2">
                            <img src={formImageUrl} alt="Vista previa" className="w-full h-44 object-cover rounded-xl mx-auto" />
                            <span className="text-sm font-extrabold text-brillo">📷 Cambiar foto</span>
                          </div>
                        ) : (
                          <div className="py-4 space-y-1">
                            <div className="text-4xl">📸</div>
                            <span className="block text-base font-extrabold text-brillo">Toca aquí para elegir foto</span>
                            <span className="block text-xs text-arena/85">Modo Megas activo: se guarda liviana</span>
                          </div>
                        )}
                        <input type="file" accept="image/*" onChange={(e) => uploadToBucket(BUCKETS.PRODUCT_IMAGES, e.target.files?.[0], setFormImageUrl)} className="hidden" />
                      </label>
                    </div>

                    <div className="rounded-2xl bg-bosque/80 border-2 border-arena/25 p-4 space-y-2">
                      <label className="block text-sm font-extrabold uppercase text-brillo">2. Nombre del producto</label>
                      <input type="text" required placeholder="Ej. Sopita de fideo" value={formName} onChange={(e) => setFormName(e.target.value)} className="w-full px-4 py-3.5 rounded-xl bg-[#0D1714] border-2 border-arena/30 text-arena text-lg font-bold" />
                      <input type="text" placeholder="Nota corta opcional" value={formDescription} onChange={(e) => setFormDescription(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl bg-[#0D1714] border border-arena/20 text-arena/90 text-sm" />
                    </div>

                    <div className="rounded-2xl bg-bosque/80 border-2 border-oro/60 p-4 space-y-2">
                      <label className="block text-sm font-extrabold uppercase text-brillo">3. Precio en Bolivianos (Bs)</label>
                      <div className="relative flex items-center">
                        <input ref={priceInputRef} type="number" inputMode="numeric" min="1" step="1" required placeholder="15" value={formPrice} onChange={(e) => setFormPrice(e.target.value.replace(/[^0-9]/g, ""))} className="w-full pl-4 pr-16 py-4 rounded-xl bg-[#0D1714] border-2 border-oro text-brillo font-brand text-3xl" />
                        <span className="absolute right-4 font-brand text-2xl text-oro">Bs</span>
                      </div>
                      <p className="text-xs font-bold text-brote">Comisión: 0 Bs — Cubierta por EcoBanco</p>
                    </div>

                    <button type="submit" className="w-full py-4 rounded-2xl bg-gradient-to-r from-oro via-brillo to-oro text-bosque font-brand text-xl shadow-gold-glow">
                      Revisar antes de publicar →
                    </button>
                  </form>
                ) : (
                  <div className="space-y-5">
                    <div className="rounded-2xl bg-bosque border-2 border-oro overflow-hidden">
                      <img src={formImageUrl} alt={formName} className="w-full h-52 object-cover" />
                      <div className="p-4 space-y-2">
                        <span className="text-xs font-extrabold text-brote uppercase">🏪 {activeMerchant.storeName}</span>
                        <h4 className="font-brand text-2xl text-arena">{formName}</h4>
                        <div className="pt-2 border-t border-arena/15 flex items-baseline justify-between">
                          <span className="text-xs font-bold uppercase text-arena/85">Precio</span>
                          <span className="font-brand text-3xl text-brillo">{formatBs(formPrice)}</span>
                        </div>
                      </div>
                    </div>
                    <div className="grid grid-cols-1 gap-3">
                      <button type="button" onClick={handleConfirmPublishProduct} className="w-full py-4 rounded-2xl bg-gradient-to-r from-brote via-[#5cd060] to-brote text-bosque font-brand text-xl shadow-green-glow">
                        Publicar así
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setProductStep("edit");
                          setTimeout(() => priceInputRef.current?.focus(), 80);
                        }}
                        className="w-full py-3.5 rounded-2xl bg-oro/20 border-2 border-oro text-brillo font-extrabold text-base uppercase"
                      >
                        Corregir precio
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL CHECKOUT CON COMPRA PROTEGIDA Y BANNER CLUB VECINO */}
          {pendingProduct && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
              <div className="max-w-md w-full rounded-2xl bg-gradient-to-b from-[#1D2F28] to-[#121D19] border-2 border-oro p-6 shadow-gold-glow space-y-4 max-h-[92vh] overflow-y-auto">
                <div className="flex items-center gap-3.5 pb-3 border-b border-arena/15">
                  {pendingProduct.imageUrl && <img src={pendingProduct.imageUrl} alt={pendingProduct.name} className="w-20 h-20 rounded-2xl object-cover border-2 border-oro shrink-0" />}
                  <div>
                    <span className="text-xs font-extrabold text-brote uppercase block">{pendingProduct.sellerName}</span>
                    <h3 className="font-brand text-xl text-arena">{pendingProduct.name}</h3>
                    <span className="font-brand text-2xl text-brillo">{formatBs(pendingProduct.priceMotes)}</span>
                  </div>
                </div>

                <div className="rounded-xl bg-[#0F1A16] border border-brote/50 p-3.5 space-y-1">
                  <div className="flex flex-wrap justify-between gap-2 text-xs font-extrabold">
                    <span className="text-brote uppercase">🛡️ Compra Protegida</span>
                    <span className="text-brillo">Comisión: 0 Bs — Cubierta por EcoBanco</span>
                  </div>
                  <p className="text-xs text-arena/90">Tu dinero se guarda seguro y solo pasa a la caserita cuando recibes tu pedido.</p>
                </div>

                {lazyError && <div className="p-3 rounded-xl bg-red-500/20 border border-red-400/60 text-sm font-bold text-red-100 text-center">⚠️ {lazyError}</div>}

                <form onSubmit={handleCheckoutSubmit} className="space-y-3.5">
                  {!isMerchantBuying && (
                    <div className="rounded-xl bg-[#101C18] border border-oro/40 p-3 flex flex-wrap items-center justify-between gap-2">
                      {pollarSession?.authenticated && pollarSession?.stellarAddress ? (
                        <span className="font-mono text-xs font-extrabold text-brillo">
                          🌟 Pollar Testnet · {formatShortStellarAddress(pollarSession.stellarAddress)}
                        </span>
                      ) : (
                        <>
                          <span className="text-xs font-bold text-arena/85">Billetera Stellar opcional para recargas:</span>
                          <button
                            type="button"
                            onClick={() => setPollarLoginModalRole("buyer")}
                            className="px-3 py-1.5 rounded-lg bg-oro/20 border border-oro/60 text-xs font-extrabold text-brillo"
                          >
                            🔐 Conectar con Pollar (Google / Email OTP)
                          </button>
                        </>
                      )}
                    </div>
                  )}

                  {!isMerchantBuying && (!hasSavedBuyerContact || editingCheckoutContact) && (
                    <>
                      <input type="text" required value={buyerNameInput} onChange={(e) => setBuyerNameInput(e.target.value)} placeholder="Tu Nombre Completo *" className="w-full px-4 py-3 rounded-xl bg-bosque border-2 border-oro/40 text-arena text-base" />
                      <input type="email" required value={buyerEmailInput} onChange={(e) => setBuyerEmailInput(e.target.value)} placeholder="Tu Correo *" className="w-full px-4 py-3 rounded-xl bg-bosque border-2 border-oro/40 text-arena text-base" />
                      <input type="tel" required value={buyerPhoneInput} onChange={(e) => setBuyerPhoneInput(e.target.value)} placeholder="Número de WhatsApp *" className="w-full px-4 py-3 rounded-xl bg-bosque border-2 border-oro/40 text-arena text-base" />
                      <input type="text" required value={buyerAddressInput} onChange={(e) => setBuyerAddressInput(e.target.value)} placeholder="Dirección de Entrega *" className="w-full px-4 py-3 rounded-xl bg-bosque border-2 border-oro/40 text-arena text-base" />
                    </>
                  )}

                  {!isMerchantBuying && !activeBuyer?.isProsumer && (
                    <div className="rounded-xl bg-[#22291A] border border-oro/55 p-3.5">
                      <p className="text-xs sm:text-sm font-semibold text-arena leading-snug">
                        ⭐ ¿Pides seguido en el barrio? Únete al <strong className="text-brillo">Club Vecino (100 Bs/mes)</strong>, recibe <strong className="text-brote">50 Bs de regalo en MOTES</strong> y envíos incluidos.
                      </p>
                    </div>
                  )}

                  <button type="submit" className="w-full py-4 rounded-2xl bg-gradient-to-r from-oro via-brillo to-oro text-bosque font-brand text-lg shadow-gold-glow border-2 border-[#fff3cc]/70">
                    Confirmar pedido · {formatBs(pendingProduct.priceMotes)}
                  </button>
                  <button type="button" onClick={() => setPendingProduct(null)} className="w-full py-2 text-sm font-bold text-arena/85">
                    Cancelar
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL CARGAR SALDO CON POLLAR RAMPWIDGET (BO / BOB -> USDC STELLAR TESTNET) */}
          {qrModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="max-w-md w-full rounded-2xl bg-bosque border-2 border-oro p-6 space-y-4 shadow-gold-glow">
                <div className="flex items-center justify-between gap-2">
                  <div>
                    <h3 className="font-brand text-xl text-brillo">Cargar saldo con QR de tu Banco</h3>
                    <p className="text-[11px] font-bold text-brote">Pollar Ramp · País: BO · BOB → USDC (Stellar Testnet)</p>
                  </div>
                  <button type="button" onClick={() => setQrModalOpen(false)} className="text-sm font-extrabold text-arena/85">✕</button>
                </div>
                <div className="p-2.5 rounded-xl bg-brote/20 border border-brote/60 text-xs font-bold text-arena text-center">
                  🛡️ Comisión: 0 Bs — Cubierta por EcoBanco
                </div>

                {qrError && (
                  <div className="p-3 rounded-xl bg-red-500/20 border border-red-400/60 text-xs font-bold text-red-100 text-center">
                    ⚠️ {qrError}
                  </div>
                )}

                {!pollarSession?.authenticated || !pollarSession?.stellarAddress ? (
                  <div className="rounded-2xl bg-[#101C18] border-2 border-oro/50 p-5 text-center space-y-3">
                    <div className="text-3xl">🔐</div>
                    <p className="text-sm font-semibold text-arena">
                      Conecta primero tu billetera Pollar en Stellar Testnet para recibir recargas reales (BOB → USDC).
                    </p>
                    <button
                      type="button"
                      onClick={() => setPollarLoginModalRole(qrTargetRole)}
                      className="w-full py-3.5 rounded-xl bg-gradient-to-r from-oro via-brillo to-oro text-bosque font-brand text-base shadow-gold-glow"
                    >
                      Conectar con Pollar (Google / Email OTP)
                    </button>
                  </div>
                ) : (
                  <>
                    <div className="rounded-xl bg-[#0D1714] border border-brote/40 px-3 py-2 flex items-center justify-between text-xs">
                      <span className="text-arena/80 font-bold">Destino custodial Stellar:</span>
                      <span className="font-mono font-extrabold text-brillo">
                        {formatShortStellarAddress(pollarSession.stellarAddress)}
                      </span>
                    </div>

                    {qrStep === "amount" ? (
                      <div className="space-y-4">
                        <div>
                          <label className="block text-xs font-bold uppercase text-arena mb-1">
                            Monto a cargar en Bolivianos (Bs)
                            {(qrPurpose === "prosumer_subscription" || qrPurpose === "merchant_premium") ? ` · Mínimo ${SUBSCRIPTION_COST} Bs` : ""}
                          </label>
                          <div className="relative flex items-center">
                            <input
                              type="number"
                              min={(qrPurpose === "prosumer_subscription" || qrPurpose === "merchant_premium") ? SUBSCRIPTION_COST : 10}
                              value={qrAmountBs}
                              onChange={(e) => setQrAmountBs(e.target.value.replace(/[^0-9]/g, ""))}
                              className="w-full pl-4 pr-16 py-4 rounded-xl bg-[#0D1714] border-2 border-oro text-brillo font-brand text-3xl"
                            />
                            <span className="absolute right-4 font-brand text-2xl text-oro">Bs</span>
                          </div>
                        </div>
                        <button
                          type="button"
                          onClick={() => {
                            const val = Math.round(Number(qrAmountBs));
                            const minVal = (qrPurpose === "prosumer_subscription" || qrPurpose === "merchant_premium") ? SUBSCRIPTION_COST : 10;
                            if (!Number.isFinite(val) || val < minVal) {
                              setQrError(`Ingresa un monto válido en Bolivianos (mínimo ${minVal} Bs).`);
                              return;
                            }
                            setQrError(null);
                            setQrStep("qr");
                          }}
                          className="w-full py-4 rounded-2xl bg-gradient-to-r from-oro via-brillo to-oro text-bosque font-brand text-lg shadow-gold-glow"
                        >
                          Abrir RampWidget Pollar ({formatBs(qrAmountBs)})
                        </button>
                      </div>
                    ) : (
                      <div className="space-y-4 text-center">
                        <div className="rounded-2xl bg-[#0D1714] border-2 border-oro p-4 space-y-2">
                          <span className="inline-block px-2.5 py-0.5 rounded-full bg-brote/25 text-brote text-[11px] font-extrabold uppercase">
                            Orden Pollar · BO / BOB → USDC
                          </span>
                          <div className="font-mono text-xs font-extrabold text-brillo break-all">
                            ID Orden: {qrOrderId}
                          </div>
                          <div className="w-40 h-40 mx-auto rounded-2xl bg-arena p-3 flex flex-col items-center justify-center text-bosque border-4 border-oro">
                            <span className="text-4xl">📱</span>
                            <span className="font-brand text-base mt-1">QR {formatBs(qrAmountBs)}</span>
                            <span className="text-[11px] font-bold">Banco Bolivia · Pollar</span>
                          </div>
                        </div>
                        <button
                          type="button"
                          onClick={confirmPollarRampOrderPreview}
                          className="w-full py-4 rounded-2xl bg-gradient-to-r from-brote via-[#5cd060] to-brote text-bosque font-brand text-lg shadow-green-glow"
                        >
                          Confirmar orden Pollar
                        </button>
                      </div>
                    )}
                  </>
                )}
              </div>
            </div>
          )}

          {/* MODAL AUTENTICACIÓN POLLAR (GOOGLE / EMAIL OTP - STELLAR TESTNET) */}
          {pollarLoginModalRole && (
            <div className="fixed inset-0 z-[60] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="max-w-md w-full rounded-2xl bg-[#15221D] border-2 border-oro p-6 space-y-4 shadow-gold-glow">
                <div className="flex items-center justify-between gap-2">
                  <div>
                    <h3 className="font-brand text-xl text-brillo">Conectar Billetera Pollar</h3>
                    <p className="text-xs font-bold text-brote">Stellar Testnet · USDC patrocinado</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => {
                      setPollarLoginModalRole(null);
                      setPollarOtpStep("choose");
                      setPollarOtpCode("");
                    }}
                    className="text-sm font-extrabold text-arena/85"
                  >
                    ✕
                  </button>
                </div>

                {pollarOtpStep === "choose" ? (
                  <div className="space-y-3">
                    <button
                      type="button"
                      onClick={() =>
                        completePollarPreviewAuth(
                          pollarLoginModalRole,
                          "google",
                          pollarEmailDraft || "vecino@gmail.com"
                        )
                      }
                      className="w-full py-3.5 px-4 rounded-xl bg-arena text-bosque font-extrabold text-sm flex items-center justify-center gap-2 shadow"
                    >
                      <span>🌐</span>
                      <span>Continuar con Google (Pollar)</span>
                    </button>

                    <div className="relative py-1 text-center">
                      <span className="px-2 bg-[#15221D] text-xs font-bold text-arena/70 uppercase">
                        o ingresa con código a tu correo
                      </span>
                    </div>

                    <div className="space-y-2.5">
                      <input
                        type="email"
                        value={pollarEmailDraft}
                        onChange={(e) => setPollarEmailDraft(e.target.value)}
                        placeholder="tu.correo@ejemplo.com"
                        className="w-full px-4 py-3 rounded-xl bg-bosque border-2 border-oro/45 text-arena text-sm"
                      />
                      <button
                        type="button"
                        onClick={() => {
                          if (!pollarEmailDraft.trim().includes("@")) return;
                          setPollarOtpStep("otp");
                        }}
                        className="w-full py-3.5 rounded-xl bg-gradient-to-r from-oro to-brillo text-bosque font-brand text-base"
                      >
                        Enviar código OTP por Email →
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3.5">
                    <p className="text-xs text-arena/90">
                      Ingresa el código de 6 dígitos enviado a <strong className="text-brillo">{pollarEmailDraft}</strong>:
                    </p>
                    <input
                      type="text"
                      inputMode="numeric"
                      maxLength="6"
                      value={pollarOtpCode}
                      onChange={(e) => setPollarOtpCode(e.target.value.replace(/\D/g, "").slice(0, 6))}
                      placeholder="123456"
                      className="w-full px-4 py-3.5 rounded-xl bg-bosque border-2 border-brote font-mono text-2xl font-bold tracking-[0.35em] text-center text-brillo"
                    />
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setPollarOtpStep("choose")}
                        className="px-4 py-3 rounded-xl bg-[#182822] border border-arena/25 text-xs font-bold text-arena"
                      >
                        ← Atrás
                      </button>
                      <button
                        type="button"
                        onClick={() =>
                          completePollarPreviewAuth(
                            pollarLoginModalRole,
                            "email_otp",
                            pollarEmailDraft
                          )
                        }
                        className="flex-1 py-3 rounded-xl bg-gradient-to-r from-brote to-[#5cd060] text-bosque font-brand text-base"
                      >
                        Verificar y Crear Cuenta G…
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<EcoBancoApp />);
  </script>
</body>
</html>
